services:
  - type: web
    name: smartlib-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SPRING_FLYWAY_LOCATIONS
        value: "classpath:db/migration,classpath:db/demo"
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=25.0 -XX:InitialRAMPercentage=3.0 -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=24m -XX:MaxDirectMemorySize=32m -XX:ActiveProcessorCount=2 -Xss256k -XX:+UseSerialGC"
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MIN_IDLE
        value: "0"
      - key: DATABASE_URL
        sync: false
      - key: SMARTLIB_BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: SMARTLIB_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: SMARTLIB_BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: SMARTLIB_BOOTSTRAP_ADMIN_FULL_NAME
        sync: false
