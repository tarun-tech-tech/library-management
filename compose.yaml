services:
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - smartlib-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      DB_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SMARTLIB_BOOTSTRAP_ADMIN_USERNAME: ${SMARTLIB_BOOTSTRAP_ADMIN_USERNAME:-}
      SMARTLIB_BOOTSTRAP_ADMIN_PASSWORD: ${SMARTLIB_BOOTSTRAP_ADMIN_PASSWORD:-}
      SMARTLIB_BOOTSTRAP_ADMIN_EMAIL: ${SMARTLIB_BOOTSTRAP_ADMIN_EMAIL:-}
      SMARTLIB_BOOTSTRAP_ADMIN_FULL_NAME: ${SMARTLIB_BOOTSTRAP_ADMIN_FULL_NAME:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  smartlib-postgres:
